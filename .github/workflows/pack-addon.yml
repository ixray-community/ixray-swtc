# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Pack addon"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "swtc-*/**"
            - "README.md"
            - "LICENSE.txt"
    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "swtc-*/**"
            - "README.md"
            - "LICENSE.txt"

defaults:
    run:
        shell: pwsh

jobs:
    pack-addon:
        name: "Pack addon"

        strategy:
            matrix:
                system:
                    - windows-latest

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Stage addon modules
              run: |
                  $path = Join-Path "temp/ixr_addons" "${{ github.event.repository.name }}"
                  New-Item -ItemType Directory -Path $path -Force | Out-Null
                  foreach ($module in @("swtc-common", "swtc-soc", "swtc-cs", "swtc-cop"))
                  {
                      if (!(Test-Path -LiteralPath "$module/addon.init"))
                      {
                          throw "Missing addon module: $module"
                      }
                      Copy-Item -LiteralPath $module -Destination $path -Recurse
                  }
                  Copy-Item -LiteralPath "README.md", "LICENSE.txt" -Destination temp

            - name: Upload addon
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-${{ github.sha }}
                  path: |
                      temp/
